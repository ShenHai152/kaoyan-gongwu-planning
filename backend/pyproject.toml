[project]
name = "exam-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "python-calamine==0.8.2",
    "python-dotenv==1.2.4",
    "sqlalchemy==2.1.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008"]
